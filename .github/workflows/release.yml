name: Build and sign shortcut

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # `shortcuts sign` only exists on macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build unsigned shortcut
        run: PYTHONPATH=src python -m xvideo_shortcut -o dist/X-Video-Downloader.unsigned.shortcut
      - name: Sign shortcut
        run: |
          shortcuts sign --mode anyone \
            --input dist/X-Video-Downloader.unsigned.shortcut \
            --output dist/X-Video-Downloader.shortcut
      - uses: actions/upload-artifact@v4
        with:
          name: shortcut
          path: dist/*.shortcut
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/X-Video-Downloader.shortcut
