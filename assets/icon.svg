<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="X Video Downloader icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14202b"/>
      <stop offset="1" stop-color="#1d9bf0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- video frame with play triangle -->
  <rect x="116" y="84" width="280" height="188" rx="30" fill="#ffffff"/>
  <path d="M232 138 L232 218 L302 178 Z" fill="#1d6fb8"/>
  <!-- download arrow into a tray -->
  <path d="M256 296 L256 372" stroke="#ffffff" stroke-width="30" stroke-linecap="round" fill="none"/>
  <path d="M212 338 L256 382 L300 338" stroke="#ffffff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M170 428 L342 428" stroke="#ffffff" stroke-width="30" stroke-linecap="round" fill="none"/>
</svg>
