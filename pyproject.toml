[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xvideo-shortcut"
version = "1.0.0"
description = "Generates an iOS Shortcut that downloads the video of an X (Twitter) post."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
xvideo-shortcut = "xvideo_shortcut.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
